<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wo &amp; Wann?</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
  <style>
    :root{color-scheme:dark;background:#0a0a0a;color:#fafafa}
    *{box-sizing:border-box}body{margin:0;font-family:"Hanken Grotesk",Inter,ui-sans-serif,system-ui,sans-serif}
    h1{margin:0}button{font:inherit;border:0;cursor:pointer}
    /* Start screen */
    #start{--bg:#0a0a0a;--text:#fafafa;--muted:#a3a3a3;--line:#262626;--line-strong:#fafafa;--surface:#141414;
      font-family:"Hanken Grotesk",Inter,ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--text);
      min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:72px 24px max(24px,env(safe-area-inset-bottom));
      position:relative;overflow:hidden;isolation:isolate}
    #start[hidden],#game[hidden]{display:none}
    .start-inner{width:100%;max-width:400px;margin:auto;display:flex;flex-direction:column;position:relative;z-index:1}
    .brand{margin:0 0 48px;text-align:center}
    .brand h1{font-size:44px;line-height:1;letter-spacing:-.035em;font-weight:700}
    .logo-wrap{position:relative;width:min(560px,calc(100vw - 32px));left:50%;transform:translateX(-50%)}
    .brand .logo{display:block;width:100%;height:auto}
    /* Last-round sticker, slightly overlapping the start button */
    .start-wrap{position:relative;margin-top:28px}
    .start-wrap #startBtn{margin-top:0}
    .score{position:absolute;z-index:1;right:-8px;top:-18px;margin:0;display:flex;flex-direction:column;align-items:center;padding:5px 10px 6px;border-radius:9px;
      background:#ffd43b;color:#0a0a0a;transform:rotate(-6deg);box-shadow:0 2px 0 rgba(0,0,0,.35);text-align:center;line-height:1;pointer-events:none;
      animation:pop 280ms cubic-bezier(.2,0,0,1) both 120ms}
    .score small{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
    .score strong{margin-top:2px;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
    .score.empty strong{font-size:12px}
    @keyframes pop{from{opacity:0;transform:rotate(-6deg) scale(.85)}}
    #start fieldset{border:0;margin:0;padding:0}
    #start legend{padding:0;margin:0 0 10px;font-size:13px;font-weight:500;color:var(--muted)}
    .themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .theme{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:104px;padding:14px 6px;margin:0;
      border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--muted);font-size:15px;font-weight:500;line-height:1.25;text-align:center;cursor:pointer;
      transition:border-color 150ms cubic-bezier(.2,0,0,1),background-color 150ms cubic-bezier(.2,0,0,1),color 150ms cubic-bezier(.2,0,0,1),transform 120ms cubic-bezier(.2,0,0,1)}
    .theme:hover{background:var(--surface)}
    .theme:active{transform:scale(.985)}
    .theme input{position:absolute;opacity:0;pointer-events:none}
    .theme:has(input:checked){border-color:var(--line-strong);color:var(--text)}
    .theme:has(input:focus-visible){outline:2px solid var(--text);outline-offset:2px}
    .rounds{margin-top:28px}
    .rounds-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
    .rounds-head label{margin:0;font-size:13px;font-weight:500;color:var(--muted)}
    .rounds-head output{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
    #rounds{-webkit-appearance:none;appearance:none;width:100%;height:44px;margin:0;padding:0;border:0;background:transparent;cursor:pointer;--p:50%}
    #rounds::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--text) var(--p),#404040 var(--p))}
    #rounds::-moz-range-track{height:4px;border-radius:2px;background:#404040}
    #rounds::-moz-range-progress{height:4px;border-radius:2px;background:var(--text)}
    #rounds::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-10px;border-radius:50%;background:var(--text);border:0;transition:transform 120ms cubic-bezier(.2,0,0,1)}
    #rounds::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--text);border:0}
    #rounds:active::-webkit-slider-thumb{transform:scale(1.1)}
    #rounds:focus-visible{outline:2px solid var(--text);outline-offset:4px;border-radius:4px}
    .ticks{display:flex;justify-content:space-between;margin-top:-6px;font-size:12px;color:#737373}
    #startBtn:disabled{background:#262626;color:#737373;opacity:1;cursor:not-allowed;transform:none}
    #startBtn{width:100%;margin-top:24px;height:56px;border-radius:12px;background:var(--text);color:var(--bg);font:600 17px/1 "Hanken Grotesk",Inter,sans-serif;
      transition:transform 120ms cubic-bezier(.2,0,0,1),opacity 120ms}
    #startBtn:hover{background:var(--text);opacity:.9}
    #startBtn:active{transform:scale(.985)}
    #startBtn:focus-visible{outline:2px solid var(--text);outline-offset:3px}
    /* Background: placeholder tiles on the inside of a slowly turning cylinder */
    .bg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
    .bg::after{content:"";position:absolute;inset:0;/* scrim: darker behind the menu for legibility */
      background:radial-gradient(ellipse 60% 70% at 50% 50%,rgba(10,10,10,.9) 40%,rgba(10,10,10,.6) 100%)}
    .ring{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;animation:spin 200s linear infinite}
    .bg.still .ring{animation-play-state:paused}
    @keyframes spin{to{transform:rotateY(-360deg)}}
    .tile{position:absolute;border-radius:6px;backface-visibility:hidden;background:#2b2b2b center/cover no-repeat}
    /* Settings */
    .icon-btn{position:absolute;z-index:2;top:max(16px,env(safe-area-inset-top));right:16px;width:44px;height:44px;padding:0;display:grid;place-items:center;
      background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;transition:background-color 120ms cubic-bezier(.2,0,0,1),transform 120ms cubic-bezier(.2,0,0,1)}
    .icon-btn:hover{background:var(--surface)}
    .icon-btn:active{transform:scale(.96)}
    .icon-btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
    #settings{--bg:#0a0a0a;--text:#fafafa;--muted:#8a8a8a;--line:#262626;font-family:"Hanken Grotesk",Inter,ui-sans-serif,system-ui,sans-serif;
      background:var(--bg);color:var(--text);border:1px solid var(--line);padding:24px;width:100%;max-width:400px;border-radius:16px}
    #settings[open]{animation:sheet 260ms cubic-bezier(.2,0,0,1)}
    #settings::backdrop{background:rgba(0,0,0,.6)}
    @keyframes sheet{from{opacity:0;transform:translateY(16px)}}
    #settings h2{font-size:20px;font-weight:600;margin:0 0 8px}
    .row{display:flex;align-items:center;justify-content:space-between;min-height:56px;border-bottom:1px solid var(--line);font-size:17px;margin:0;font-weight:500;color:var(--text)}
    .row .val{color:var(--muted)}
    .switch{appearance:none;-webkit-appearance:none;width:44px;height:26px;padding:0;margin:0;border-radius:13px;border:0;background:#3a3a3a;position:relative;cursor:pointer;transition:background-color 150ms cubic-bezier(.2,0,0,1)}
    .switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--text);transition:transform 150ms cubic-bezier(.2,0,0,1)}
    .switch:checked{background:#fafafa}.switch:checked::after{background:#0a0a0a;transform:translateX(18px)}
    .switch:focus-visible{outline:2px solid var(--text);outline-offset:2px}
    #settingsDone{width:100%;margin-top:24px;height:56px;border-radius:12px;background:var(--text);color:var(--bg);font:600 17px/1 "Hanken Grotesk",Inter,sans-serif}
    #settingsDone:hover{background:var(--text);opacity:.9}
    @media(max-width:639px){#settings{margin:auto 0 0;max-width:none;border-radius:16px 16px 0 0;border-width:1px 0 0;padding-bottom:max(24px,env(safe-area-inset-bottom))}}
    .start-foot{position:relative;z-index:1;margin:32px auto 0;max-width:960px;text-align:center;font-size:14px;line-height:1.45;color:var(--muted);text-wrap:balance}
    @media(min-width:640px){.brand h1{font-size:56px}}
    @media(max-height:640px){#start{padding-top:64px}.theme{min-height:80px;padding:10px 6px;gap:6px}.brand{margin-bottom:20px}.rounds{margin-top:14px}.start-wrap{margin-top:22px}.start-foot{margin-top:14px}}
    @media(prefers-reduced-motion:reduce){.score{animation:none}#start *,#settings,#settings *{transition:none!important}#settings[open]{animation:none}}
    /* Game screen: full-screen panorama, dock with timeline + map */
    #game{--bg:#0a0a0a;--text:#fafafa;--muted:#a3a3a3;--line:#262626;--surface:#141414;--card:rgba(10,10,10,.88);
      position:fixed;inset:0;background:var(--bg);color:var(--text);overflow:hidden}
    #panorama{position:absolute;inset:0}
    #panorama .pnlm-load-box{background:var(--card);border-radius:12px;font-family:inherit}
    #backBtn{left:16px;right:auto;background:var(--card)}
    .round-pill{position:absolute;z-index:2;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);height:44px;padding:0 16px;display:flex;align-items:center;
      border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
    .dock{position:absolute;z-index:2;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(960px,calc(100% - 32px));
      display:flex;align-items:flex-end;gap:12px;pointer-events:none}
    .dock>*{pointer-events:auto}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px}
    .timeline{flex:1;min-width:0;height:120px;padding:14px 20px 12px}
    .timeline-head{display:flex;justify-content:space-between;align-items:baseline}
    .timeline-head label{margin:0;font-size:13px;font-weight:500;color:var(--muted)}
    .timeline-head output{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
    .timeline-head span{font-size:13px;font-weight:500;color:var(--muted)}
    .timeline-head output.empty{font-size:15px;font-weight:500;color:#737373}
    /* Ruler: vertical ticks every 10 years, longer every 50, labelled every 100 */
    .ruler{position:relative;height:62px;margin:4px 0 0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
    .ruler:focus-visible{outline:2px solid var(--text);outline-offset:4px;border-radius:6px}
    .ruler-track{position:absolute;left:12px;right:12px;top:0;bottom:0}
    .ruler-track::after{content:"";position:absolute;left:0;right:0;top:32px;height:1px;background:#404040}
    .tick{position:absolute;top:32px;width:1px;height:8px;margin-top:-8px;background:#525252}
    .tick.mid{height:14px;margin-top:-14px;background:#737373}
    .tick.major{height:24px;margin-top:-24px;background:#a3a3a3}
    .tick-label{position:absolute;top:38px;transform:translateX(-50%);font-size:12px;color:#8a8a8a;font-variant-numeric:tabular-nums}
    .marker,.ghost{position:absolute;top:0;height:40px;width:2px;margin-left:-1px;pointer-events:none}
    .marker{background:#ffd43b;border-radius:1px}
    .marker::before{content:"";position:absolute;left:50%;top:-3px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#ffd43b}
    .ghost{background:rgba(250,250,250,.35)}
    .timeline-head output.preview{color:#737373}
    .marker[hidden],.ghost[hidden]{display:none}
    @media(hover:none){.ghost{display:none}}
    .map-slot{position:relative;flex:none;width:200px;height:120px}
    .map{position:absolute;right:0;bottom:0;width:200px;height:120px;overflow:hidden;cursor:pointer;background:var(--card);
      transition:width 240ms cubic-bezier(.2,0,0,1),height 240ms cubic-bezier(.2,0,0,1)}
    .map.open{z-index:3;background:#0f0f0f;cursor:crosshair;width:min(880px,calc(100vw - 32px));height:min(500px,calc(100vh - 150px),calc((100vw - 32px)*.62))}
    .map.panning{cursor:grabbing}
    .map-label{position:absolute;z-index:1;left:12px;top:10px;font-size:13px;font-weight:500;color:var(--muted);pointer-events:none}
    .map-view{position:absolute;left:8px;right:8px;top:30px;bottom:8px;touch-action:none}
    .map-view svg{display:block;width:100%;height:100%}
    .map-view .countries path{fill:#4a4a4a;stroke:#141414;stroke-width:.6px;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill 120ms}
    .map.open .map-view .countries path:hover{fill:#5e5e5e}
    .map-view .labels{display:none;fill:#e5e5e5;font-family:inherit;font-weight:500;text-anchor:middle;dominant-baseline:middle;
      paint-order:stroke;stroke:rgba(10,10,10,.85);stroke-linejoin:round;pointer-events:none}
    .map.open .map-view .labels{display:block}
    .map-view .labels text.off{display:none}
    .map-view .pin{fill:#ffd43b;stroke:#0a0a0a;stroke-width:1.25px;vector-effect:non-scaling-stroke}
    .zoom{position:absolute;z-index:1;right:12px;bottom:12px;display:none;flex-direction:column;gap:6px}
    .map.open .zoom{display:flex}
    .zoom button{width:40px;height:40px;border-radius:10px;background:var(--bg);color:var(--text);border:1px solid var(--line);font-size:20px;line-height:1;
      transition:background-color 120ms cubic-bezier(.2,0,0,1),transform 120ms cubic-bezier(.2,0,0,1)}
    .zoom button:hover{background:var(--surface)}
    .zoom button:active{transform:scale(.96)}
    @media(max-width:639px){
      .dock{flex-direction:column;align-items:stretch;gap:8px}
      .map-slot{align-self:flex-end;width:132px;height:80px}
      .map{width:132px;height:80px}
      .map:not(.open) .map-label{display:none}
      .map:not(.open) .map-view{top:6px;left:6px;right:6px;bottom:6px}
      .map.open{height:min(420px,calc(100vh - 220px))}
      .timeline{height:auto;padding:12px 16px 10px}
    }
    @media(prefers-reduced-motion:reduce){.map,#game *{transition:none!important}}
  </style>
</head>
<body>
<section id="start" aria-labelledby="startTitle">
  <div class="bg" id="bg" aria-hidden="true"><div class="ring" id="ring"></div></div>
  <button class="icon-btn" id="settingsBtn" type="button" aria-label="Einstellungen" aria-haspopup="dialog">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <div class="start-inner">
    <div class="brand"><div class="logo-wrap"><h1 id="startTitle"><img class="logo" src="assets/logo-wo-und-wann.png" width="1200" height="228" alt="Wo &amp; Wann?"></h1></div></div>
    <form id="startForm">
      <!-- Theme blocks (docs/SCENE_MASTERPLAN_30.md) and images per round are stored and exposed as body[data-blocks] / body[data-rounds]; gameplay does not use them yet. -->
      <fieldset>
        <legend>Themen</legend>
        <div class="themes">
          <label class="theme"><input type="checkbox" name="block" value="production" checked><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20V9l5 3V9l5 3V9l5 3V4h3v16z"/><path d="M7 16h2M12 16h2"/></svg><span>Produktion</span></label>
          <label class="theme"><input type="checkbox" name="block" value="trade" checked><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.9.94 5.34 2.81 7.76"/><path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"/><path d="M12 10v4"/><path d="M12 2v3"/></svg><span>Handel &amp; Macht</span></label>
          <label class="theme"><input type="checkbox" name="block" value="events" checked><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></svg><span>Wendepunkte</span></label>
        </div>
      </fieldset>
      <div class="rounds">
        <div class="rounds-head"><label for="rounds">Bilder pro Runde</label><output id="roundsOut" for="rounds">5 · Mittel</output></div>
        <input id="rounds" name="rounds" type="range" min="1" max="9" step="1" value="5">
        <div class="ticks" aria-hidden="true"><span>Leicht</span><span>Mittel</span><span>Schwer</span></div>
      </div>
      <div class="start-wrap">
        <button id="startBtn" type="submit">Spiel starten</button>
        <p class="score empty" id="score" role="status"><small>Highscore</small><strong id="scoreValue">Noch keine Runde</strong></p>
      </div>
    </form>
  </div>
  <p class="start-foot">Ein ZuWi Creative Assignment von Matteo Winter &amp; Niklas Meller unter Aufsicht von Wolfgang Gruber</p>
</section>
<dialog id="settings" aria-labelledby="settingsTitle">
  <h2 id="settingsTitle">Einstellungen</h2>
  <label class="row" for="motion">Hintergrund bewegen<input class="switch" id="motion" type="checkbox" role="switch" checked></label>
  <div class="row">Sprache<span class="val">Deutsch</span></div>
  <form method="dialog"><button id="settingsDone">Fertig</button></form>
</dialog>
<div id="game" hidden>
  <div id="panorama" aria-label="360°-Ansicht: ziehen zum Umsehen"></div>
  <button class="icon-btn" id="backBtn" type="button" aria-label="Zurück zum Start">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <div class="round-pill" id="roundPill">Bild 1 / 5</div>
  <div class="dock">
    <div class="card timeline">
      <div class="timeline-head"><span id="whenLabel">Wann?</span><output id="yearOut" class="empty">Jahr antippen</output></div>
      <div class="ruler" id="ruler" role="slider" tabindex="0" aria-labelledby="whenLabel" aria-valuemin="1600" aria-valuemax="2025" aria-valuetext="kein Jahr gewählt">
        <div class="ruler-track" id="rulerTrack"><div class="ghost" id="ghost" hidden></div><div class="marker" id="marker" hidden></div></div>
      </div>
    </div>
    <div class="map-slot"><div class="card map" id="map" role="button" tabindex="0" aria-label="Weltkarte: Ort markieren">
      <span class="map-label">Wo?</span>
      <div class="map-view" id="mapView"></div>
      <div class="zoom"><button type="button" id="zoomIn" aria-label="Hineinzoomen">+</button><button type="button" id="zoomOut" aria-label="Herauszoomen">−</button></div>
    </div></div>
  </div>
</div>
<script>
// Start-screen background: historical images (public domain / CC0, see docs/START_SCREEN_IMAGES.md)
// on the inside of a cylinder.
// Tiles at the sides are close to the camera, the middle ones far behind.
(()=>{
const bg=document.getElementById('bg'),ring=document.getElementById('ring');
const imgs=["e01-boston-tea-party", "e03-suez-1869", "e04-nyse-crowd-1929", "e06-gdansk-gate-1980", "p01-zaandam-mills-1871", "p02-glassworks-encyclopedie", "p03-porcelain-vase-1650", "p04-boiling-house-1823", "p05-powerloom-1835", "p06-tomioka-1872", "p07-krupp-essen-1901", "p10-ford-line-1913", "p12-dammam-7-1938", "p16-atacama-ponds-2018", "t01-voc-oostenburg-1805", "t02-cape-coast-1806", "t03-calcutta-1835", "t04-canton-factories-1806"];
function build(){
  const w=innerWidth,h=innerHeight,N=14,R=Math.max(w*.55,480);
  const cw=2*R*Math.tan(Math.PI/N)*.9,ch=cw*.72,gap=ch*1.1,step=360/N;
  const rows=Math.min(9,Math.ceil(h/(gap*.55))+1);
  bg.style.perspective=(R*1.35)+'px';
  ring.replaceChildren();
  for(let r=0;r<rows;r++)for(let i=0;i<N;i++){
    const t=document.createElement('div');t.className='tile';
    const y=(r-(rows-1)/2)*gap;
    t.style.cssText='width:'+cw+'px;height:'+ch+'px;left:'+(-cw/2)+'px;top:'+(y-ch/2)+'px;background-image:url(assets/start/'+imgs[(i+r*5)%imgs.length]+'.jpg)'+
      ';transform:rotateY('+(i*step+(r%2)*step/2)+'deg) translateZ('+(-R)+'px)';
    ring.appendChild(t);}
}
let still=matchMedia('(prefers-reduced-motion: reduce)').matches;
try{const v=localStorage.getItem('mit-motion');if(v!==null)still=v==='off';}catch(e){}
const sw=document.getElementById('motion');sw.checked=!still;bg.classList.toggle('still',still);
sw.addEventListener('change',()=>{bg.classList.toggle('still',!sw.checked);try{localStorage.setItem('mit-motion',sw.checked?'on':'off');}catch(e){}});
document.getElementById('settingsBtn').addEventListener('click',()=>document.getElementById('settings').showModal());
document.getElementById('settings').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close();});
let t;addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(build,150);});
build();
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
<script>
(async ()=>{
let scenes=[],viewer=null;
const $=id=>document.getElementById(id);
// Widest view that still looks natural: about 100° vertical, at most 130° horizontal. Zoom is locked to it.
function fov(){const a=innerWidth/innerHeight;return Math.min(130,2*Math.atan(Math.tan(50*Math.PI/180)*a)*180/Math.PI);}
// Panorama source, in this order:
// 1. ?pano=assets/... (relative paths under assets/ only)
// 2. a local, git-excluded test image (assets/panoramas/_local/test.png etc.) if present on this machine
// 3. the first scene in scenes.json
const LOCAL_TEST=['assets/panoramas/_local/automobilfabrik.png'];
async function panoUrl(){const q=new URLSearchParams(location.search).get('pano');
  if(q&&/^assets\/[\w\/.-]+\.(jpe?g|png|webp)$/i.test(q))return q;
  for(const u of LOCAL_TEST){try{if((await fetch(u,{method:'HEAD'})).ok)return u;}catch(e){}}
  return (scenes.find(s=>s.panorama_path)||{}).panorama_path;}
async function startGame(){
  if(viewer)return;const url=await panoUrl();if(!url||!window.pannellum||viewer)return;const h=fov();
  viewer=pannellum.viewer('panorama',{type:'equirectangular',panorama:url,autoLoad:true,showControls:false,compass:false,
    mouseZoom:false,keyboardZoom:false,hfov:h,minHfov:h,maxHfov:h,pitch:0,yaw:0});
}
addEventListener('resize',()=>{if(!viewer)return;const h=fov();viewer.setHfovBounds([h,h]);viewer.setHfov(h,false);});
try{const r=await fetch('data/scenes.json');if(r.ok)scenes=(await r.json()).scenes||[];}catch(e){}
// Timeline
// Timeline ruler: click or drag to pick a year; arrow keys ±1, Shift ±10.
const Y0=1600,Y1=2025,ruler=$('ruler'),track=$('rulerTrack'),marker=$('marker'),ghost=$('ghost');let guessYear=null;
const pct=y=>(y-Y0)/(Y1-Y0)*100;
for(let y=Y0;y<=Y1;y+=10){const t=document.createElement('div');t.className='tick'+(y%100===0?' major':y%50===0?' mid':'');t.style.left=pct(y)+'%';track.appendChild(t);
  if(y%100===0){const l=document.createElement('span');l.className='tick-label';l.textContent=y;l.style.left=pct(y)+'%';track.appendChild(l);}}
const yearAt=x=>{const r=track.getBoundingClientRect();return Math.round(Y0+Math.min(1,Math.max(0,(x-r.left)/r.width))*(Y1-Y0));};
const yearOut=$('yearOut');
// Header shows the chosen year; while hovering it previews the year under the pointer in grey.
function showYear(preview){if(preview!=null){yearOut.textContent=preview;yearOut.className='preview';return;}
  if(guessYear==null){yearOut.textContent='Jahr antippen';yearOut.className='empty';}else{yearOut.textContent=guessYear;yearOut.className='';}}
function setYear(y){guessYear=Math.min(Y1,Math.max(Y0,y));marker.style.left=pct(guessYear)+'%';marker.hidden=false;showYear();
  ruler.setAttribute('aria-valuenow',guessYear);ruler.setAttribute('aria-valuetext',String(guessYear));}
let dragging=false;
ruler.addEventListener('pointerdown',e=>{dragging=true;ghost.hidden=true;ruler.setPointerCapture(e.pointerId);setYear(yearAt(e.clientX));});
ruler.addEventListener('pointermove',e=>{const y=yearAt(e.clientX);if(dragging){setYear(y);return;}
  if(e.pointerType!=='mouse')return;ghost.style.left=pct(y)+'%';ghost.hidden=false;showYear(y);});
ruler.addEventListener('pointerup',()=>{dragging=false;});
ruler.addEventListener('pointerleave',()=>{ghost.hidden=true;showYear();});
ruler.addEventListener('keydown',e=>{const d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];if(!d)return;e.preventDefault();
  setYear((guessYear??1810)+d*(e.shiftKey?10:1));});
// Map: countries with German names (Natural Earth, public domain). Opens on hover (tap on touch),
// zoom with wheel / pinch / +−, drag to pan, click to place the pin (stored as lon/lat).
const map=$('map'),mapView=$('mapView');let guessLL=null,svg=null,labels=null,pinG=null;
const FULL={x:0,y:6,w:360,h:142},vb={...FULL},MAXZ=12;
const isOpen=()=>map.classList.contains('open');
function unitsPerPx(){const r=mapView.getBoundingClientRect();return Math.max(vb.w/r.width,vb.h/r.height);}
function clampVb(){vb.w=Math.min(FULL.w,Math.max(FULL.w/MAXZ,vb.w));vb.h=vb.w*FULL.h/FULL.w;
  vb.x=Math.min(FULL.x+FULL.w-vb.w,Math.max(FULL.x,vb.x));vb.y=Math.min(FULL.y+FULL.h-vb.h,Math.max(FULL.y,vb.y));}
function render(){if(!svg||!mapView.getBoundingClientRect().width)return;clampVb();svg.setAttribute('viewBox',vb.x+' '+vb.y+' '+vb.w+' '+vb.h);
  const u=unitsPerPx(),z=FULL.w/vb.w,fs=12*u;labels.style.fontSize=fs+'px';labels.style.strokeWidth=(fs*.28)+'px';
  // Which names fit: rank threshold grows with pixels per degree, then overlapping names are dropped (most important first).
  const ppd=1/u,thr=Math.max(1.8,2.2+1.7*Math.log2(ppd/2.4)),boxes=[],ts=[...labels.children].sort((a,b)=>a.dataset.min-b.dataset.min);
  for(const t of ts){let show=+t.dataset.min<=thr;
    if(show){const x=+t.getAttribute('x'),y=+t.getAttribute('y'),hw=t.textContent.length*fs*.29+fs*.3,hh=fs*.65;
      if(x-hw<vb.x||x+hw>vb.x+vb.w||y-hh<vb.y||y+hh>vb.y+vb.h)show=false;
      else if(boxes.some(b=>Math.abs(b[0]-x)<b[2]+hw&&Math.abs(b[1]-y)<b[3]+hh))show=false;else boxes.push([x,y,hw,hh]);}
    t.classList.toggle('off',!show);}
  if(guessLL){const x=guessLL.lon+180,y=90-guessLL.lat,k=28/24*u;pinG.setAttribute('transform','translate('+x+' '+y+') scale('+k+') translate(-12 -22)');pinG.style.display='';}}
function toSvg(cx,cy){const m=svg.getScreenCTM().inverse();return new DOMPoint(cx,cy).matrixTransform(m);}
function zoomAt(cx,cy,f){const p=toSvg(cx,cy),nw=Math.min(FULL.w,Math.max(FULL.w/MAXZ,vb.w/f)),k=nw/vb.w;
  vb.x=p.x-(p.x-vb.x)*k;vb.y=p.y-(p.y-vb.y)*k;vb.w=nw;render();}
fetch('assets/map/countries.svg').then(r=>r.text()).then(t=>{mapView.innerHTML=t;svg=mapView.querySelector('svg');
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');labels=svg.querySelector('.labels');
  pinG=document.createElementNS('http://www.w3.org/2000/svg','path');pinG.setAttribute('class','pin');pinG.style.display='none';
  pinG.setAttribute('d','M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12zM12 12.6a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2z');pinG.setAttribute('fill-rule','evenodd');
  svg.appendChild(pinG);render();});
// open / close
let closeT;
function openMap(){clearTimeout(closeT);if(!isOpen()){map.classList.add('open');setTimeout(render,260);}}
function closeMap(){map.classList.remove('open');setTimeout(render,260);}
map.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')openMap();});
map.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!pointers.size)closeT=setTimeout(closeMap,350);});
document.addEventListener('pointerdown',e=>{if(!map.contains(e.target)&&isOpen())closeMap();});
map.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();isOpen()?closeMap():openMap();}
  else if(isOpen()&&(e.key==='+'||e.key==='-')){const r=mapView.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,e.key==='+'?1.6:1/1.6);}});
for(const [id,f] of [['zoomIn',1.6],['zoomOut',1/1.6]])$(id).addEventListener('click',e=>{e.stopPropagation();const r=mapView.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,f);});
// wheel zoom
mapView.addEventListener('wheel',e=>{if(!isOpen()||!svg)return;e.preventDefault();zoomAt(e.clientX,e.clientY,Math.pow(1.0018,-e.deltaY));},{passive:false});
// pan, pinch, click
const pointers=new Map();let moved=false,pinchD=0;
mapView.addEventListener('pointerdown',e=>{if(!svg)return;if(!isOpen()){openMap();return;}
  mapView.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
  if(pointers.size===2){const [a,b]=[...pointers.values()];pinchD=Math.hypot(a.x-b.x,a.y-b.y);}});
mapView.addEventListener('pointermove',e=>{const prev=pointers.get(e.pointerId);if(!prev)return;
  const cur={x:e.clientX,y:e.clientY};
  if(pointers.size===1){const dx=cur.x-prev.x,dy=cur.y-prev.y;if(!moved&&Math.hypot(dx,dy)<4)return;
    moved=true;map.classList.add('panning');const u=unitsPerPx();vb.x-=dx*u;vb.y-=dy*u;pointers.set(e.pointerId,cur);render();return;}
  pointers.set(e.pointerId,cur);const [a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y);moved=true;
  if(pinchD){zoomAt((a.x+b.x)/2,(a.y+b.y)/2,d/pinchD);}pinchD=d;});
function endPointer(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);pinchD=0;map.classList.remove('panning');
  if(e.type==='pointerup'&&!moved&&!pointers.size){const p=toSvg(e.clientX,e.clientY);
    if(p.x>=0&&p.x<=360&&p.y>=FULL.y&&p.y<=FULL.y+FULL.h){guessLL={lon:p.x-180,lat:90-p.y};render();}}}
mapView.addEventListener('pointerup',endPointer);mapView.addEventListener('pointercancel',endPointer);
addEventListener('resize',render);
$('backBtn').addEventListener('click',()=>{$('game').hidden=true;$('start').hidden=false;});
const blockInputs=[...document.querySelectorAll('#startForm input[name=block]')];
function syncStart(){const n=blockInputs.filter(i=>i.checked).length;$('startBtn').disabled=!n;$('startBtn').textContent=n?'Spiel starten':'Mindestens ein Thema wählen';}
try{const saved=JSON.parse(localStorage.getItem('mit-blocks'));if(Array.isArray(saved)&&saved.length)blockInputs.forEach(i=>i.checked=saved.includes(i.value));}catch(e){}
blockInputs.forEach(i=>i.addEventListener('change',syncStart));syncStart();
// Last-round sticker: the game will later store mit-last-round = {"correct":n,"total":m}. ?demo=score shows a sample.
(()=>{let last=null;try{last=JSON.parse(localStorage.getItem('mit-last-round'));}catch(e){}
  if(/[?&]demo=score\b/.test(location.search))last={correct:7,total:9};
  if(!(last&&Number.isFinite(last.correct)&&last.total>0))return;
  const el=$('score');el.classList.remove('empty');el.querySelector('small').textContent='Letzte Runde';$('scoreValue').textContent=last.correct+'/'+last.total;})();
const rounds=$('rounds');
function syncRounds(){const v=+rounds.value;rounds.style.setProperty('--p',((v-1)/8*100)+'%');
  $('roundsOut').textContent=v+' · '+(v<=3?'Leicht':v<=6?'Mittel':'Schwer');}
try{const r=+localStorage.getItem('mit-rounds');if(r>=1&&r<=9)rounds.value=r;}catch(e){}
rounds.addEventListener('input',syncRounds);syncRounds();
$('startForm').addEventListener('submit',e=>{e.preventDefault();const blocks=new FormData(e.target).getAll('block');if(!blocks.length)return;
try{localStorage.setItem('mit-blocks',JSON.stringify(blocks));}catch(err){}
document.body.dataset.blocks=blocks.join(' ');document.body.dataset.rounds=rounds.value;
try{localStorage.setItem('mit-rounds',rounds.value);}catch(err){}$('roundPill').textContent='Bild 1 / '+rounds.value;$('start').hidden=true;$('game').hidden=false;render();startGame();});
})();
</script>
